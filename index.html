<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#140f2b" />
  <title>Blub! Mazmorras de Limo</title>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="life">
        <div class="life-blob"></div>
        <div class="life-bar"><div id="life-fill"></div><div id="life-min"></div></div>
        <span id="life-pct">100%</span>
      </div>
      <div id="level-name"></div>
      <div class="hud-right">
        <span id="timer">0:00</span>
        <button id="btn-pause" class="icon-btn" aria-label="Pausa">II</button>
      </div>
    </div>
    <div id="toast" hidden></div>
    <div id="joy-zone" aria-label="Joystick">
      <div id="joy-base"><div id="joy-knob"></div></div>
    </div>
    <div class="controls">
      <button id="btn-merge" class="ctl ctl-merge">UNIR</button>
      <button id="btn-split" class="ctl ctl-split">DIVIDIR</button>
      <button id="btn-jump" class="ctl ctl-jump">SALTAR</button>
    </div>
  </div>

  <div id="screen-title" class="screen">
    <h1 class="logo">Blub!</h1>
    <p class="subtitle">Mazmorras de Limo</p>
    <button id="btn-start" class="big-btn" disabled>Tocar para jugar</button>
    <p id="load-hint" class="hint">Cargando modelos…</p>
  </div>

  <div id="screen-levels" class="screen" hidden>
    <h2>Elige mazmorra</h2>
    <div id="level-list"></div>
    <div class="control-pick" role="group" aria-label="Control">
      <button class="pick-btn" data-mode="joystick">Joystick</button>
      <button class="pick-btn" data-mode="gyro">Giroscopio</button>
    </div>
    <button id="btn-calib-menu" class="small-btn gyro-only">Calibrar inclinación</button>
  </div>

  <div id="screen-pause" class="screen" hidden>
    <h2>Pausa</h2>
    <button id="btn-resume" class="big-btn">Seguir</button>
    <div class="control-pick" role="group" aria-label="Control">
      <button class="pick-btn" data-mode="joystick">Joystick</button>
      <button class="pick-btn" data-mode="gyro">Giroscopio</button>
    </div>
    <button id="btn-calib" class="small-btn gyro-only">Calibrar inclinación</button>
    <button id="btn-restart" class="small-btn">Reiniciar</button>
    <button id="btn-menu" class="small-btn">Salir al menú</button>
  </div>

  <div id="screen-result" class="screen" hidden>
    <h2 id="result-title"></h2>
    <div id="result-stars"></div>
    <p id="result-info"></p>
    <button id="btn-next" class="big-btn">Siguiente</button>
    <button id="btn-retry" class="small-btn">Repetir</button>
    <button id="btn-result-menu" class="small-btn">Menú</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
