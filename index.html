<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#140f2b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="canonical" href="https://slime-abyss.pages.dev/" />
  <title>Slime Abyss</title>
  <meta name="description" content="Juego de un limo líquido que desciende por el abismo: divídete, júntate y rueda por raíles. Gratis en el navegador." />
  <!-- vista previa al compartir el enlace (WhatsApp, Telegram, redes): la imagen necesita dirección absoluta -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Slime Abyss" />
  <meta property="og:title" content="Slime Abyss" />
  <meta property="og:description" content="Juego de un limo líquido que desciende por el abismo. Gratis en el navegador." />
  <meta property="og:url" content="https://slime-abyss.pages.dev/" />
  <meta property="og:image" content="https://slime-abyss.pages.dev/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Slime Abyss: un limo azul con cara en su habitación del abismo" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Slime Abyss" />
  <meta name="twitter:image" content="https://slime-abyss.pages.dev/og-image.jpg" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ====================================================== HUD -->
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-left">
        <div class="hud-chip life">
          <canvas id="life-bar" aria-hidden="true"></canvas>
          <span id="life-pct">100%</span>
        </div>
        <div class="state-badge" id="hud-state" role="img" hidden>
          <svg class="ico" id="state-ico" viewBox="0 0 24 24" aria-hidden="true"></svg>
          <span id="state-sec" class="state-sec" aria-hidden="true"></span>
        </div>
      </div>
      <div id="level-name"></div>
      <div class="hud-right">
        <div class="hud-chip coins" id="hud-coins">
          <svg class="ico coin-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>
          <span id="coins-count">0/0</span>
        </div>
        <span id="timer">0:00</span>
        <button id="btn-pause" class="icon-btn" data-i18n-aria="hud.pause">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
        </button>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="joy-zone" aria-hidden="true">
      <div id="joy-base"><div id="joy-knob"></div></div>
    </div>
    <button id="btn-squeeze" class="squeeze-btn" data-i18n-aria="hud.squeeze">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 15 6 6m-6-6v4.8m0-4.8h4.8"/><path d="M9 19.8V15m0 0H4.2M9 15l-6 6"/><path d="M15 4.2V9m0 0h4.8M15 9l6-6"/><path d="M9 4.2V9m0 0H4.2M9 9 3 3"/></svg>
    </button>
    <div id="cam-zone" aria-hidden="true">
      <div id="cam-base"><div id="cam-knob"><svg class="ico" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div></div>
    </div>
  </div>

  <!-- ====================================================== MENÚ PRINCIPAL -->
  <div id="screen-main" class="screen screen-main">
    <div id="gpu-warning" class="gpu-warning" role="alert" hidden>
      <span data-i18n="toast.noGpu"></span>
      <button id="btn-gpu-warning" class="icon-btn" data-i18n-aria="common.close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <button id="btn-fullscreen" class="icon-btn fs-btn" data-i18n-aria="common.fullscreen">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <div class="main-brand">
      <h1 class="logo" aria-label="Slime Abyss">
        <svg class="logo-art" viewBox="0 0 480 330" aria-hidden="true">
          <defs>
            <linearGradient id="logo-slime" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="200">
              <stop offset="0" stop-color="#e2f7ff"/><stop offset="0.38" stop-color="#7fd0ff"/><stop offset="0.7" stop-color="#2f8cff"/><stop offset="1" stop-color="#1846b8"/>
            </linearGradient>
            <linearGradient id="logo-abyss" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="300">
              <stop offset="0" stop-color="#f3e8ff"/><stop offset="0.38" stop-color="#b9a0ff"/><stop offset="0.72" stop-color="#7c4dff"/><stop offset="1" stop-color="#3b1f99"/>
            </linearGradient>
            <linearGradient id="logo-gloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="clip-top-slime"><rect x="0" y="30" width="480" height="58"/></clipPath>
            <clipPath id="clip-top-abyss"><rect x="0" y="178" width="480" height="52"/></clipPath>
          </defs>
        <g class="logo-word">
          <text class="logo-depth" x="16" y="150" font-size="156" transform="translate(0 10)">Slime</text>
          <g class="logo-drips-outline logo-depth" transform="translate(0 10)"></g>
          <g class="logo-drips-outline logo-outline"></g>
          <text class="logo-outline" x="16" y="150" font-size="156">Slime</text>
          <g class="logo-drips-fill" fill="url(#logo-slime)"></g>
          <text class="logo-fill" data-word="slime" x="16" y="150" font-size="156" fill="url(#logo-slime)">Slime</text>
          <text class="logo-gloss" x="16" y="150" font-size="156" fill="url(#logo-gloss)" clip-path="url(#clip-top-slime)">Slime</text>
        </g>
        <g class="logo-word">
          <text class="logo-depth" x="16" y="292" font-size="140" transform="translate(0 10)">Abyss</text>
          
          
          <text class="logo-outline" x="16" y="292" font-size="140">Abyss</text>
          
          <text class="logo-fill" data-word="abyss" x="16" y="292" font-size="140" fill="url(#logo-abyss)">Abyss</text>
          <text class="logo-gloss" x="16" y="292" font-size="140" fill="url(#logo-gloss)" clip-path="url(#clip-top-abyss)">Abyss</text>
        </g>
        </svg>
      </h1>
    </div>
    <div class="main-actions">
      <button id="btn-story" class="big-btn" data-i18n="menu.story" disabled></button>
      <div class="menu-grid">
        <button class="small-btn with-icon" data-go="collection">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978"/><path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978"/><path d="M18 9h1.5a1 1 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/><path d="M6 9H4.5a1 1 0 0 1 0-5H6"/></svg>
          <span data-i18n="menu.collection"></span>
        </button>
        <button class="small-btn with-icon" data-go="achievements">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/></svg>
          <span data-i18n="menu.achievements"></span>
        </button>
        <button class="small-btn with-icon" data-go="myslime">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
          <span data-i18n="menu.myslime"></span>
        </button>
        <button class="small-btn with-icon" data-go="profile">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span data-i18n="menu.profile"></span>
        </button>
        <button class="small-btn with-icon" data-go="options">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
          <span data-i18n="menu.options"></span>
        </button>
        <button class="small-btn with-icon" data-go="creator">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></svg>
          <span data-i18n="menu.creator"></span>
        </button>
      </div>
      <p id="load-hint" class="hint"></p>
    </div>
  </div>

  <!-- ====================================================== HISTORIA -->
  <div id="screen-story" class="screen" hidden>
    <header class="screen-head">
      <button class="icon-btn" data-back="main" data-i18n-aria="common.back">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h2 data-i18n="story.title"></h2>
    </header>
    <div id="chapter-list" class="card-row"></div>
  </div>

  <div id="screen-chapter" class="screen" hidden>
    <header class="screen-head">
      <button class="icon-btn" data-back="story" data-i18n-aria="common.back">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <div>
        <h2 id="chapter-title"></h2>
        <p id="chapter-sub" class="head-sub"></p>
      </div>
      <p id="chapter-reward" class="reward-note"></p>
    </header>
    <div id="floor-list" class="floor-grid"></div>
    <button id="btn-chapter-breakdown" class="small-btn" data-i18n="story.breakdown" hidden></button>
  </div>

  <!-- ====================================================== COLECCIÓN -->
  <div id="screen-collection" class="screen screen-side" hidden>
    <div class="side-panel">
      <header class="screen-head">
        <button class="icon-btn" data-back="main" data-i18n-aria="common.back">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <h2 data-i18n="collection.title"></h2>
        <span id="collection-count" class="count-chip"></span>
      </header>
      <p class="panel-note" data-i18n="collection.hint"></p>
      <div id="collection-list" class="item-grid"></div>
    </div>
  </div>

  <!-- ====================================================== LOGROS -->
  <div id="screen-achievements" class="screen screen-side" hidden>
    <div class="side-panel">
      <header class="screen-head">
        <button class="icon-btn" data-back="main" data-i18n-aria="common.back">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <h2 data-i18n="achievements.title"></h2>
        <span id="achievements-count" class="count-chip"></span>
      </header>
      <p class="panel-note" data-i18n="achievements.hint"></p>
      <div id="achievements-list" class="ach-list"></div>
    </div>
  </div>

  <!-- ====================================================== MI LIMO -->
  <div id="screen-myslime" class="screen screen-side" hidden>
    <div class="side-panel">
      <header class="screen-head">
        <button class="icon-btn" data-back="main" data-i18n-aria="common.back">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <h2 data-i18n="myslime.title"></h2>
        <span id="myslime-wallet" class="wallet-chip"></span>
      </header>
      <div id="myslime-options" class="look-options"></div>
    </div>
  </div>

  <!-- ====================================================== PERFIL -->
  <div id="screen-profile" class="screen" hidden>
    <header class="screen-head">
      <button class="icon-btn" data-back="main" data-i18n-aria="common.back">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h2 data-i18n="profile.title"></h2>
    </header>
    <div class="profile-card">
      <div class="profile-id">
        <div id="profile-avatar" class="avatar" aria-hidden="true"></div>
        <div>
          <p id="profile-name" class="profile-name"></p>
          <p id="profile-email" class="panel-note"></p>
        </div>
      </div>
      <button id="btn-google" class="google-btn">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span id="google-label" data-i18n="profile.signIn"></span>
      </button>
      <button id="btn-signout" class="small-btn" data-i18n="profile.signOut" hidden></button>
      <p id="profile-status" class="panel-note" role="status" aria-live="polite"></p>
      <p class="panel-label" data-i18n="profile.stats"></p>
      <div id="profile-stats" class="stat-grid"></div>
    </div>
  </div>

  <!-- ====================================================== OPCIONES -->
  <div id="screen-options" class="screen" hidden>
    <header class="screen-head">
      <button class="icon-btn" data-back="main" data-i18n-aria="common.back">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h2 data-i18n="options.title"></h2>
    </header>
    <div class="settings-panel">
      <div class="setting-row">
        <span data-i18n="options.language"></span>
        <select id="lang-select" class="lang-select" data-i18n-aria="options.language"></select>
      </div>
      <div class="setting-row">
        <span data-i18n="options.control"></span>
        <div class="control-pick" role="group">
          <button class="pick-btn" data-mode="joystick" data-i18n="options.joystick"></button>
          <button class="pick-btn" data-mode="gyro" data-i18n="options.gyro"></button>
        </div>
      </div>
      <div class="setting-row joy-only">
        <span data-i18n="options.joysticks"></span>
        <div class="control-pick" role="group">
          <button class="pick-btn joy-pick" data-joy="floating" data-i18n="options.floating"></button>
          <button class="pick-btn joy-pick" data-joy="fixed" data-i18n="options.fixed"></button>
        </div>
      </div>
      <div class="setting-row gyro-only">
        <span data-i18n="options.neutral"></span>
        <button id="btn-calib" class="small-btn" data-i18n="options.calibrate"></button>
      </div>
      <div class="setting-row">
        <span data-i18n="options.sound"></span>
        <button id="btn-sound" class="small-btn toggle-btn"></button>
      </div>
      <div class="setting-row">
        <span data-i18n="options.vibration"></span>
        <button id="btn-vibration" class="small-btn toggle-btn"></button>
      </div>
      <div class="setting-row">
        <span data-i18n="options.practice"></span>
        <button id="btn-practice" class="small-btn" data-i18n="options.play"></button>
      </div>
    </div>
  </div>

  <!-- ====================================================== CREADOR -->
  <div id="screen-creator" class="screen" hidden>
    <header class="screen-head">
      <button class="icon-btn" data-back="main" data-i18n-aria="common.back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <h2 data-i18n="creator.title"></h2>
      <span id="creator-count" class="count-chip"></span>
    </header>
    <p class="panel-note creator-note" data-i18n="creator.hint"></p>
    <div id="creator-slots" class="creator-slots"></div>
  </div>

  <div id="screen-editor" class="screen editor-screen" hidden>
    <div class="editor-top">
      <button id="btn-editor-back" class="icon-btn" data-i18n-aria="creator.saveExit"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <input id="editor-name" class="editor-name" maxlength="24" data-i18n-aria="creator.name" autocomplete="off" spellcheck="false" />
      <button id="btn-editor-undo" class="icon-btn" data-i18n-aria="creator.undo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/></svg></button>
      <button id="btn-editor-fit" class="icon-btn" data-i18n-aria="creator.fit"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button id="btn-editor-test" class="small-btn with-icon editor-test"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg><span data-i18n="creator.test"></span></button>
    </div>
    <div class="editor-body">
      <canvas id="editor-canvas" class="editor-canvas"></canvas>
      <aside class="editor-side">
        <div class="editor-tools" role="group" data-i18n-aria="creator.tools">
          <button class="tool-btn" data-tool="paint" data-i18n-aria="creator.paint"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg></button>
          <button class="tool-btn" data-tool="raise" data-i18n-aria="creator.raise"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
          <button class="tool-btn" data-tool="lower" data-i18n-aria="creator.lower"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></button>
          <button class="tool-btn" data-tool="pan" data-i18n-aria="creator.pan"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
        </div>
        <p id="editor-brush" class="editor-brush"></p>
        <div id="editor-palette" class="editor-palette" role="group" data-i18n-aria="creator.blocks"></div>
        <div class="editor-size">
          <span data-i18n="creator.width"></span>
          <button class="tool-btn" data-size="w-" data-i18n-aria="creator.smaller"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <b id="editor-w"></b>
          <button class="tool-btn" data-size="w+" data-i18n-aria="creator.bigger"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
          <span data-i18n="creator.depth"></span>
          <button class="tool-btn" data-size="d-" data-i18n-aria="creator.smaller"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <b id="editor-d"></b>
          <button class="tool-btn" data-size="d+" data-i18n-aria="creator.bigger"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
        </div>
      </aside>
    </div>
  </div>

  <!-- ====================================================== PAUSA -->
  <div id="screen-pause" class="screen" hidden>
    <h2 data-i18n="pause.title"></h2>
    <button id="btn-resume" class="big-btn" data-i18n="pause.resume"></button>
    <div class="control-pick" role="group">
      <button class="pick-btn" data-mode="joystick" data-i18n="options.joystick"></button>
      <button class="pick-btn" data-mode="gyro" data-i18n="options.gyro"></button>
    </div>
    <button id="btn-pause-calib" class="small-btn gyro-only" data-i18n="pause.calibrate"></button>
    <button id="btn-pause-fullscreen" class="small-btn with-icon">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      <span data-i18n="common.fullscreen"></span>
    </button>
    <div class="btn-row">
      <button id="btn-restart" class="small-btn" data-i18n="pause.restart"></button>
      <button id="btn-quit" class="small-btn" data-i18n="pause.quit"></button>
    </div>
  </div>

  <!-- ====================================================== RESULTADO -->
  <div id="screen-result" class="screen" hidden>
    <div class="result-card">
      <h2 id="result-title"></h2>
      <div id="result-stars" class="stars-big" aria-live="polite"></div>
      <ul id="result-goals" class="goals"></ul>
      <div class="btn-row">
        <button id="btn-next" class="big-btn"></button>
      </div>
      <div class="btn-row">
        <button id="btn-retry" class="small-btn" data-i18n="result.retry"></button>
        <button id="btn-result-back" class="small-btn"></button>
      </div>
    </div>
  </div>

  <!-- ====================================================== DESGLOSE DEL CAPÍTULO -->
  <div id="screen-breakdown" class="screen" hidden>
    <div class="breakdown-card">
      <h2 id="bd-title"></h2>
      <p id="bd-sub" class="head-sub"></p>
      <div class="table-wrap">
        <table class="bd-table">
          <thead>
            <tr>
              <th data-i18n="breakdown.floor"></th><th data-i18n="breakdown.stars"></th><th data-i18n="breakdown.coins"></th>
              <th data-i18n="breakdown.secret"></th><th data-i18n="breakdown.slime"></th><th data-i18n="breakdown.time"></th>
            </tr>
          </thead>
          <tbody id="bd-rows"></tbody>
          <tfoot>
            <tr><th data-i18n="breakdown.total"></th><td id="bd-stars"></td><td id="bd-coins"></td><td id="bd-secrets"></td><td id="bd-pct"></td><td id="bd-time"></td></tr>
          </tfoot>
        </table>
      </div>
      <div class="btn-row bd-actions">
        <div id="bd-rank" class="rank"></div>
        <button id="btn-bd-chapter" class="small-btn" data-i18n="breakdown.backChapter"></button>
        <button id="btn-bd-menu" class="big-btn" data-i18n="breakdown.menu"></button>
      </div>
    </div>
  </div>

  <!-- ====================================================== NUEVO COLECCIONABLE -->
  <div id="screen-reward" class="screen" hidden>
    <div class="reward-card">
      <p id="reward-label" class="panel-label"></p>
      <div id="reward-visual" class="reward-visual" aria-hidden="true"></div>
      <h2 id="reward-title"></h2>
      <p id="reward-note" class="panel-note"></p>
      <button id="btn-reward-ok" class="big-btn" data-i18n="collection.ok"></button>
    </div>
  </div>

  <!-- ====================================================== GIRAR EL MÓVIL -->
  <div id="rotate-overlay" role="alert">
    <svg class="rotate-phone" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
    <p data-i18n="common.rotate"></p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
